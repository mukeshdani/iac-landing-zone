name: "Azure Landing Zone DevSecOps Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Required for requesting the JWT token used in OIDC federation
  contents: read  # Required for checking out the repository code

jobs:
  # ==============================================================================
  # STAGE 1: STATIC CODE ANALYSIS AND SECURITY SCANNING
  # ==============================================================================
  security_scans:
    name: "Security & Lint Analysis"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to enable full commit history scanning for secrets

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run TFLint
      run: |
        tflint --init
        tflint -f compact --recursive --disable-rule=terraform_required_version --disable-rule=terraform_required_providers

    - name: Run Checkov Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        output_format: cli
        soft_fail: true # Non-blocking execution enabled to allow pipeline continuity during initial evaluation

  # ==============================================================================
  # STAGE 2: INFRASTRUCTURE PIPELINE AUTOMATION - PRE-DEPLOYMENT VALIDATION (PLAN)
  # ==============================================================================
  terraform_plan:
    name: "Terraform Plan"
    needs: security_scans # Sequential execution dependency enforced
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    # Navigates to the parent root module directory to initialize backend state and compute speculative changes
    - name: Terraform Init & Plan (Parent)
      run: |
        cd parent
        terraform init
        terraform plan -out=tfplan-parent

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: parent/tfplan-parent

  # ==============================================================================
  # STAGE 3: INFRASTRUCTURE PIPELINE AUTOMATION - DEPLOYMENT EXECUTION (APPLY)
  # ==============================================================================
  terraform_apply:
    name: "Terraform Apply (Production Deployment)"
    needs: terraform_plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Enforces branch-protection pipeline logic
    runs-on: ubuntu-latest
    environment: production # Triggers manual approval gating mechanism configured within the GitHub UI
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: parent

    - name: Terraform Init & Apply
      run: |
        cd parent
        terraform init
        terraform apply -auto-approve tfplan-parent
