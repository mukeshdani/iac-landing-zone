name: "Azure Landing Zone DevSecOps Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  # =======================================================
  # STAGE 1: SECURITY & LINT SCANNING
  # =======================================================
  security_scans:
    name: "Security & Lint Analysis"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Gitleaks history scan karne ke liye zaroori hai

    # 1. Gitleaks (Secret/Password Detection)
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 2. Setup Terraform for Linter
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 3. TFLint (Terraform Best Practices Linter)
    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run TFLint
      run: |
        tflint --init
        tflint -f compact --recursive

    # 4. Checkov (Advance Cloud Security Static Analysis)
    - name: Run Checkov Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        output_format: cli
        soft_fail: false # Security vulnerability par pipeline fail ho jayegi

  # =======================================================
  # STAGE 2: TERRAFORM PLAN
  # =======================================================
  terraform_plan:
    name: "Terraform Plan"
    needs: security_scans # Security scans pass hone ka wait karegi
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"

    # Plan on Parent Folder
    - name: Terraform Init & Plan (Parent)
      run: |
        cd parent
        terraform init
        terraform plan -out=tfplan-parent

    # Plan file ko save karna taaki Apply job ise use kar sake
    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: parent/tfplan-parent

  # =======================================================
  # STAGE 3: MANUAL APPROVAL & DEPLOY (Sirf Main Branch)
  # =======================================================
  terraform_apply:
    name: "Terraform Apply (Production Deployment)"
    needs: terraform_plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # GitHub par Manual Approval trigger karega
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Saved plan ko download karna
    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: parent

    - name: Terraform Init & Apply
      run: |
        cd parent
        terraform init
        terraform apply -auto-approve tfplan-parent
