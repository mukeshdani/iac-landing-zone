name: "Azure Landing Zone DevSecOps Pipeline (08-08-2026)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows safe manual trigger via the GitHub Actions UI to run the destroy phase exclusively
  workflow_dispatch:
    inputs:
      destroy_infrastructure:
        description: "Enforce explicit deletion flag. Set to 'true' to execute teardown."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  # ==============================================================================
  # STAGE 1: STATIC CODE ANALYSIS AND SECURITY SCANNING
  # ==============================================================================
  security_scans:
    name: "Security & Lint Analysis"
    runs-on: ubuntu-latest
    # Bypasses execution when running a manual infrastructure deletion event
    if: github.event.inputs.destroy_infrastructure != 'true'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run TFLint
      run: |
        tflint --init
        tflint -f compact --recursive --disable-rule=terraform_required_version --disable-rule=terraform_required_providers

    - name: Run Checkov Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        output_format: cli
        soft_fail: true

  # ==============================================================================
  # STAGE 2: INFRASTRUCTURE PIPELINE AUTOMATION - PRE-DEPLOYMENT VALIDATION (PLAN)
  # ==============================================================================
  terraform_plan:
    name: "Terraform Plan"
    needs: security_scans
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"
        terraform_wrapper: false

    - name: Terraform Init & Plan (Parent)
      run: |
        cd 08-08-2026
        terraform init
        terraform plan -out=tfplan-parent

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: 08-08-2026/tfplan-parent

  # ==============================================================================
  # STAGE 3: INFRASTRUCTURE PIPELINE AUTOMATION - DEPLOYMENT EXECUTION (APPLY)
  # ==============================================================================
  terraform_apply:
    name: "Terraform Apply (Production Deployment)"
    needs: terraform_plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.inputs.destroy_infrastructure != 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"
        terraform_wrapper: false

    - name: Download Plan Artifact
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: 08-08-2026

    - name: Terraform Init & Apply
      run: |
        cd 08-08-2026
        terraform init
        terraform apply -auto-approve tfplan-parent

  # ==============================================================================
  # STAGE 4: INFRASTRUCTURE TEARDOWN AUTOMATION - DESTRUCTION STATE (DESTROY)
  # ==============================================================================
  terraform_destroy:
    name: "Terraform Destroy (Infrastructure Deletion)"
    # Executes only via direct explicit user UI interaction trigger request
    if: github.event.inputs.destroy_infrastructure == 'true'
    runs-on: ubuntu-latest
    environment: production # Mandatory structural peer review gating mechanism assignment
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.5.7"
        terraform_wrapper: false

    - name: Terraform Init & Destroy
      run: |
        cd 08-08-2026
        terraform init
        terraform destroy -auto-approve
